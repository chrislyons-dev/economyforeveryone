name: Deploy Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Generate CSP headers
        run: npm run csp:generate

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME || secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          PROJECT_NAME="${CF_PAGES_PROJECT_NAME:-economyforeveryone}"
          echo "Using Pages project: $PROJECT_NAME"

          if npx -y wrangler pages project list --format json | node -e "const fs=require('fs'); const name=process.argv[1]; const list=JSON.parse(fs.readFileSync(0,'utf8')); process.exit(list.some((p)=>p.name===name)?0:1)" "$PROJECT_NAME"; then
            echo "Pages project '$PROJECT_NAME' already exists."
          else
            echo "Creating Pages project '$PROJECT_NAME'..."
            npx -y wrangler pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT_NAME || secrets.CF_PAGES_PROJECT_NAME || 'economyforeveryone' }} --commit-dirty=true
